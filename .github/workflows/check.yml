name: Check outages

on:
  schedule:
    # Daily at 06:00 UTC = 08:00 Europe/Prague (summer) / 07:00 (winter).
    # Picking an off-the-hour minute to avoid API rush at :00.
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  # NB: no `pull_request` trigger — see the top-level `if:` guard below.
  # Self-hosted runners must never execute untrusted PR code (would RCE the
  # home server). The workflow is only safe to run on commits we own.

permissions:
  contents: write  # needed to commit updated state/seen.json back

jobs:
  check:
    # Pin to the self-hosted runner labelled `home-server`. EG.D's Azure WAF
    # blocks GitHub-hosted runner IPs; the home runner egresses from a Czech
    # residential IP and is not blocked.
    runs-on: [self-hosted, Linux, home-server]

    # Defense-in-depth: even without a pull_request trigger, refuse to run on
    # anything that isn't an owner-driven event.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.repository_owner == github.actor)

    concurrency:
      group: check-outages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        # The self-hosted runner must have python3.12 + venv available.
        # Validate the version here so a bad environment fails fast.
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run outage check
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          ADDRESS_LABEL: ${{ secrets.ADDRESS_LABEL }}
          EGD_ADDRESS_ID: ${{ secrets.EGD_ADDRESS_ID }}
          EGD_ADDRESS_LABEL: ${{ secrets.EGD_ADDRESS_LABEL }}
        run: .venv/bin/python main.py

      - name: Commit updated state
        run: |
          if ! git diff --quiet -- state/seen.json; then
            git config user.name "home-monitor-bot"
            git config user.email "home-monitor-bot@users.noreply.github.com"
            git add state/seen.json
            git commit -m "chore: update outage state [skip ci]"
            git push
          else
            echo "No state changes."
          fi
